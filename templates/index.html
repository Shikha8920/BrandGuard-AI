<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrandGuard AI - Brand Governance Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-6">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-8">
        <header class="mb-6">
            <h1 class="text-3xl font-bold text-gray-800">🛡️ BrandGuard AI</h1>
            <p class="text-gray-600">Automated Brand Governance & Policy Checking</p>
        </header>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Brand Guidelines / Rules:</label>
                <textarea id="guidelines" rows="3" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">Standard Brand Tone: Professional, clear, no exaggerated claims, no competitor mentioning.</textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Content to Check (Marketing copy, social post, etc.):</label>
                <textarea id="content" rows="5" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Enter content here..."></textarea>
            </div>

            <button onclick="checkContent()" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition">
                Check Content Against Guidelines
            </button>
        </div>

        <div id="loading" class="hidden mt-6 text-center text-gray-500">
            Analyzing content with BrandGuard AI... ⏳
        </div>

        <div id="result-container" class="hidden mt-6 p-4 bg-gray-100 rounded-lg border border-gray-200">
            <h2 class="text-xl font-bold text-gray-800 mb-2">Analysis Result:</h2>
            <div id="analysis-output" class="whitespace-pre-wrap text-gray-700"></div>

            <div class="mt-4 flex gap-4">
                <button onclick="handleDecision('Approved')" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Approve Content</button>
                <button onclick="handleDecision('Rejected')" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">Request Revision</button>
            </div>
        </div>
    </div>

    <script>
        async function checkContent() {
            const guidelines = document.getElementById('guidelines').value;
            const content = document.getElementById('content').value;
            const loading = document.getElementById('loading');
            const resultContainer = document.getElementById('result-container');
            const output = document.getElementById('analysis-output');

            if (!content.trim()) {
                alert('Please enter some content to check!');
                return;
            }

            loading.classList.remove('hidden');
            resultContainer.classList.add('hidden');

            try {
                const response = await fetch('/check-brand', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content, guidelines })
                });

                const data = await response.json();
                loading.classList.add('hidden');
                resultContainer.classList.remove('hidden');

                if (data.success) {
                    output.textContent = data.analysis;
                } else {
                    output.textContent = 'Error: ' + data.error;
                }
            } catch (err) {
                loading.classList.add('hidden');
                alert('An error occurred: ' + err.message);
            }
        }

        function handleDecision(status) {
            alert('Content marked as: ' + status + '. Workflow completed successfully!');
        }
    </script>
</body>
</html>
